name: check-sources

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * 1"  # every Monday 06:17 UTC

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check sources
        run: python scrapers/check_sources.py
      - name: Probe insurer care finders
        continue-on-error: true
        run: python -m scrapers.probe_insurers
      - name: Probe JavaScript care finders in a headless browser
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m scrapers.probe_finders_browser
      - name: Check the Zilveren Kruis finder service (two towns, records the HTTP status)
        continue-on-error: true
        run: python -m scrapers.zk_zorgzoeker 2
      - name: Look for reimbursement percentages on Menzis and CZ pages (candidates, checked by hand)
        continue-on-error: true
        timeout-minutes: 20
        run: python -m scrapers.verify_premiums Menzis CZ
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/source_check
          for f in docs/data_inventory/insurer_finders.md docs/data_inventory/finder_* docs/data_inventory/zk_zorgzoeker.md docs/data_inventory/vergoeding_controle.md; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "Update source check report"
          git pull --rebase && git push
