name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    # the same image Railway builds: fail here before a deploy fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t beterverzekerd .
      - name: Start the app and check its health
        run: |
          docker run -d -p 8080:8080 -e PORT=8080 --name app beterverzekerd
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/_stcore/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
